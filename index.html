<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Non-Conformités Maupu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#c0272d;
    --red-dark:#9c1f24;
    --steel:#3d4750;
    --steel-light:#eef1f3;
    --steel-mid:#c7ced3;
    --bg:#f4f5f6;
    --card:#ffffff;
    --text:#2a2f34;
    --text-mute:#6b747c;
    --ok:#2e8b57;
    --ok-bg:#e7f4ec;
    --warn:#c98a12;
    --warn-bg:#fbf1dc;
    --orange:#e8730a;
    --orange-dark:#b85c08;
    --orange-bg:#fdead9;
    --info:#3d6b96;
    --info-bg:#e4eef6;
    --crit-bg:#fce6e6;
    --line:#e2e5e8;
    --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Barlow',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.card-title{font-family:'Barlow Condensed',system-ui,sans-serif;}
  .screen{display:none;min-height:100vh;flex-direction:column;padding-bottom:90px;}
  .screen.active{display:flex;}
  .fade{animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Header */
  header.app-header{
    background:linear-gradient(135deg,var(--steel) 0%,#2c343b 100%);
    color:#fff;padding:16px 18px 14px;
    position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo-wrap{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-logo{height:40px;width:auto;display:block;}
  .brand-text h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand-text span{font-size:11px;color:#cfd6db;text-transform:uppercase;letter-spacing:.8px;}
  .icon-btn{
    background:rgba(255,255,255,.12);border:none;color:#fff;width:36px;height:36px;
    border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:16px;transition:transform .1s ease, background .15s ease;
  }
  .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.22);}

  .conn-badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.14);}
  .conn-badge.online{color:#c9f5d9;}
  .conn-badge.offline{color:#ffd0d0;}
  .conn-badge.syncing{color:#ffe6b8;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-top:14px;background:rgba(255,255,255,.1);padding:4px;border-radius:10px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:8px;font-size:14px;font-weight:600;
    color:#dfe4e7;cursor:pointer;transition:all .15s ease;}
  .tab.active{background:#fff;color:var(--steel);box-shadow:0 1px 3px rgba(0,0,0,.2);}

  /* Search + filters */
  .toolbar{padding:14px 16px 6px;}
  .search-row{display:flex;gap:8px;align-items:center;}
  .search-row .search-wrap{flex:1;}
  .date-filter-btn{
    flex-shrink:0;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease, background .15s ease;
  }
  .date-filter-btn:active{transform:scale(.94);}
  .date-filter-btn.active{background:var(--red);border-color:var(--red);filter:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);}
  .date-filter-panel{
    background:#fff;border-radius:var(--radius);padding:13px 14px;margin-top:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .date-filter-panel .field-row{margin-bottom:10px;}
  .date-filter-reset{
    background:none;border:none;color:var(--red-dark);font-size:13px;font-weight:700;
    cursor:pointer;padding:0;
  }
  .search-wrap{position:relative;}
  .search-wrap input{
    width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14px;background:#fff;
  }
  .search-wrap input:focus{outline:none;border-color:var(--red);}
  .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-mute);font-size:14px;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);
    font-size:13px;font-weight:600;color:var(--text-mute);cursor:pointer;transition:all .12s ease;white-space:nowrap;
  }
  .chip.active{background:var(--steel);border-color:var(--steel);color:#fff;}
  .chip:active{transform:scale(.96);}

  /* List */
  .list{padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .nc-card{
    background:var(--card);border-radius:var(--radius);padding:13px 14px;
    border-left:4px solid var(--steel-mid);box-shadow:0 1px 3px rgba(0,0,0,.06);
    cursor:pointer;transition:transform .1s ease, box-shadow .15s ease;
  }
  .nc-card:active{transform:scale(.985);}
  .nc-card.grav-critique{border-left-color:var(--red);}
  .nc-card.grav-majeure{border-left-color:var(--warn);}
  .nc-card.grav-mineure{border-left-color:var(--steel-mid);}
  .nc-card.statut-cloturee{border-left-color:var(--ok);background:#fafffb;}
  .nc-card.statut-encours{border-left-color:var(--orange);}
  .nc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .nc-ref{font-size:15px;font-weight:700;color:var(--text);}
  .nc-type-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-mute);}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .badge-ouverte{background:var(--crit-bg);color:var(--red-dark);}
  .badge-encours{background:var(--orange-bg);color:var(--orange-dark);}
  .badge-cloturee{background:var(--ok-bg);color:var(--ok);}
  .nc-desc{font-size:13.5px;color:var(--text-mute);margin-top:5px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .nc-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:12px;color:var(--text-mute);}
  .nc-meta span{display:flex;align-items:center;gap:4px;}
  .grav-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:8px;display:inline-block;}
  .grav-pill.grav-critique{background:var(--crit-bg);color:var(--red-dark);}
  .grav-pill.grav-majeure{background:var(--warn-bg);color:var(--warn);}
  .grav-pill.grav-mineure{background:var(--steel-light);color:var(--steel);}
  .sous-statut-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:8px;margin-left:6px;display:inline-block;background:var(--info-bg);color:var(--info);}
  .pending-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:8px;margin-left:6px;display:inline-block;background:#fff3d6;color:#9a6b00;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-mute);}
  .empty-state .e-icon{font-size:40px;margin-bottom:10px;}

  /* Floating add button */
  .fab{
    position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;
    background:var(--red);color:#fff;border:none;font-size:26px;display:flex;align-items:center;
    justify-content:center;box-shadow:0 4px 14px rgba(192,39,45,.45), inset 0 -3px 0 rgba(0,0,0,.2);
    cursor:pointer;z-index:20;transition:transform .1s ease;
  }
  .fab:active{transform:scale(.9);}

  /* Fiche / Form screens */
  .sub-header{
    background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
  }
  .back-btn{background:var(--steel-light);border:none;width:34px;height:34px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--steel);}
  .sub-header h2{margin:0;font-size:18px;flex:1;}
  .sub-header .sub-ref{font-size:12px;color:var(--text-mute);display:block;margin-top:1px;font-family:'Barlow';}

  .form-body,.fiche-body{padding:16px;display:flex;flex-direction:column;gap:16px;}
  .section{background:#fff;border-radius:var(--radius);padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .section h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mute);font-family:'Barlow';font-weight:700;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin-bottom:5px;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:14.5px;background:#fbfbfc;color:var(--text);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);background:#fff;}
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .readonly-text{font-size:14.5px;color:var(--text);line-height:1.45;white-space:pre-wrap;}
  .trace-line{font-size:12px;color:var(--text-mute);margin-top:-4px;}

  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{
    flex:1;padding:11px 6px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--text-mute);cursor:pointer;
  }
  .type-toggle button.active{border-color:var(--red);color:var(--red-dark);background:#fff5f5;}

  .status-row{display:flex;gap:8px;flex-wrap:wrap;}
  .status-pill-btn{
    padding:9px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
    font-family:inherit;font-size:13px;font-weight:600;color:var(--text-mute);cursor:pointer;flex:1;min-width:110px;text-align:center;
  }
  .status-pill-btn.active.st-ouverte{border-color:var(--red);color:var(--red-dark);background:#fff5f5;}
  .status-pill-btn.active.st-encours{border-color:var(--orange);color:var(--orange-dark);background:#fff4ea;}
  .status-pill-btn.active.st-cloturee{border-color:var(--ok);color:var(--ok);background:#f0fbf3;}

  .photo-zone{
    border:1.5px dashed var(--steel-mid);border-radius:10px;padding:22px 12px;
    text-align:center;color:var(--text-mute);font-size:13px;
  }
  .photo-zone .p-icon{font-size:24px;display:block;margin-bottom:6px;}

  footer.actions{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px;display:flex;gap:10px;z-index:15;box-shadow:0 -2px 10px rgba(0,0,0,.05);
  }
  .btn{
    flex:1;padding:13px;border-radius:10px;border:none;font-family:inherit;font-weight:700;
    font-size:14.5px;cursor:pointer;transition:transform .08s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
  .btn-primary:disabled{background:#d9b3b4;box-shadow:none;cursor:not-allowed;}
  .btn-secondary{background:var(--steel-light);color:var(--steel);}
  .btn-ghost{background:#fff;color:var(--red-dark);border:1.5px solid var(--crit-bg);}
  .btn-close{background:var(--ok);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
  .btn-close:disabled{background:#b9ddc4;box-shadow:none;cursor:not-allowed;}
  #fiche-body input:disabled, #fiche-body select:disabled, #fiche-body textarea:disabled{background:#f1f2f3;color:#8a929a;cursor:not-allowed;}
  .status-pill-btn:disabled{opacity:.55;cursor:not-allowed;}

  .note-banner{
    background:#fff8e1;border:1px solid #f0dca0;color:#8a6d1f;font-size:12.5px;
    padding:10px 12px;border-radius:9px;line-height:1.4;
  }
</style>
</head>

<!-- ============ ECRAN CREATION ============ -->
<div id="screen-create" class="screen">
  <div class="sub-header">
    <button class="back-btn" onclick="goBack('screen-list')">←</button>
    <h2>Nouvelle non-conformité</h2>
  </div>

  <div class="form-body">
    <div class="section">
      <h3>Type de non-conformité</h3>
      <div class="type-toggle">
        <button id="type-btn-interne" class="active" onclick="setCreateType('interne')">Interne</button>
        <button id="type-btn-externe" onclick="setCreateType('externe')">Externe</button>
      </div>
    </div>

    <div class="section">
      <h3>Détection</h3>
      <div class="field-row">
        <div class="field">
          <label>Date de détection</label>
          <input type="date" id="c-date">
        </div>
        <div class="field">
          <label>Gravité</label>
          <select id="c-gravite">
            <option value="mineure">Mineure</option>
            <option value="majeure" selected>Majeure</option>
            <option value="critique">Critique</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Référence / produit concerné</label>
        <input type="text" id="c-reference" placeholder="Ex : Benne 9132 EVO 40, n° série...">
      </div>
      <div class="field">
        <label>Description du problème constaté</label>
        <textarea id="c-description" placeholder="Décrire l'anomalie observée..."></textarea>
      </div>
    </div>

    <div class="section interne-only" id="section-interne">
      <h3>Origine interne</h3>
      <div class="field">
        <label>Service / atelier concerné</label>
        <select id="c-service">
          <option value="">Sélectionner...</option>
          <option>Production</option>
          <option>Soudure</option>
          <option>Peinture</option>
          <option>Contrôle qualité</option>
          <option>Logistique / Expédition</option>
          <option>Bureau d'études</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="field">
        <label>Fiche atelier</label>
        <input type="text" id="c-fiche-atelier" placeholder="Ex : FA-2026-0143">
      </div>
      <div class="field">
        <label>Fournisseur (optionnel)</label>
        <input type="text" id="c-fournisseur-interne" placeholder="Nom du fournisseur, si applicable">
      </div>
    </div>

    <div class="section externe-only" id="section-externe" style="display:none;">
      <h3>Origine externe</h3>
      <div class="field">
        <label>Client concerné</label>
        <input type="text" id="c-client" placeholder="Nom du client">

/* ===================== PERSISTANCE LOCALE + MODE HORS LIGNE ===================== */
const STORAGE_KEY = "nc_maupu_data_v1";
const DELETES_KEY = "nc_maupu_pending_deletes_v1";
let pendingDeletes = [];

(function loadPersistedData(){
  try{
    const rawData = localStorage.getItem(STORAGE_KEY);
    if(rawData) data = JSON.parse(rawData);
    const rawDeletes = localStorage.getItem(DELETES_KEY);
    if(rawDeletes) pendingDeletes = JSON.parse(rawDeletes);
  }catch(e){ /* localStorage indisponible ou corrompu : on garde les données d'exemple */ }
})();

function persistData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    localStorage.setItem(DELETES_KEY, JSON.stringify(pendingDeletes));
  }catch(e){ /* stockage plein ou indisponible : la session continue en mémoire uniquement */ }
}

function isOnline(){
  return navigator.onLine;
}

function updateConnectionBadge(){
  const badge = document.getElementById("conn-badge");
  if(!badge) return;
  const pendingCount = data.filter(n => n._pendingSync).length + pendingDeletes.length;
  if(!SUPABASE_CONFIGURED){
    badge.textContent = pendingCount ? `🟡 Local uniquement (${pendingCount} en attente)` : "🟡 Local uniquement";
    badge.className = "conn-badge syncing";
  } else if(!isOnline()){
    badge.textContent = pendingCount ? `🔴 Hors ligne (${pendingCount} en attente)` : "🔴 Hors ligne";
    badge.className = "conn-badge offline";
  } else if(pendingCount > 0){
    badge.textContent = `🔄 Synchronisation (${pendingCount})...`;
    badge.className = "conn-badge syncing";
  } else {
    badge.textContent = "🟢 En ligne";
    badge.className = "conn-badge online";
  }
}

/* Charge les fiches depuis Supabase (si configuré et en ligne) et met à jour le cache local */
async function loadFromSupabase(){
  if(!canSync()) return;
  try{
    const { data: rows, error } = await sb.from(SUPABASE_TABLE).select("*").order("created_at", {ascending:false});
    if(error) throw error;
    const unsynced = data.filter(n => n._isNew || n._pendingSync);
    const serverRecords = rows.map(rowToRecord);
    data = [...serverRecords, ...unsynced];
    persistData();
    renderList();
    updateConnectionBadge();
  }catch(e){
    /* Pas de réseau ou erreur Supabase : on continue avec le cache local */
  }
}

/* Envoie une nouvelle fiche vers Supabase, puis remplace l'id/num local par ceux de la base */
async function syncCreate(n){
  try{
    const { data: inserted, error } = await sb.from(SUPABASE_TABLE).insert(recordToRow(n)).select().single();
    if(error) throw error;
    Object.assign(n, rowToRecord(inserted));
    delete n._isNew;
    delete n._pendingSync;
    persistData();
    renderList();
    updateConnectionBadge();
  }catch(e){
    n._pendingSync = true;
    persistData();
    updateConnectionBadge();
  }
}

async function syncUpdate(n){
  try{
    const { error } = await sb.from(SUPABASE_TABLE).update(recordToRow(n)).eq("id", n.id);
    if(error) throw error;
    delete n._pendingSync;
    persistData();
    renderList();
    updateConnectionBadge();
  }catch(e){
    n._pendingSync = true;
    persistData();
    updateConnectionBadge();
  }
}

async function syncDelete(id){
  try{
    const { error } = await sb.from(SUPABASE_TABLE).delete().eq("id", id);
    if(error) throw error;
  }catch(e){
    pendingDeletes.push(id);
    persistData();
    updateConnectionBadge();
  }
}

async function flushPendingQueue(){
  if(!canSync()){ updateConnectionBadge(); return; }
  updateConnectionBadge();

  const deletesToRetry = pendingDeletes.slice();
  pendingDeletes = [];
  for(const id of deletesToRetry){ await syncDelete(id); }

  const toCreate = data.filter(n => n._isNew);
  const toUpdate = data.filter(n => n._pendingSync && !n._isNew);
  for(const n of toCreate){ await syncCreate(n); }
  for(const n of toUpdate){ await syncUpdate(n); }

  const totalSynced = deletesToRetry.length + toCreate.length + toUpdate.length;
  await loadFromSupabase();

  const badge = document.getElementById("conn-badge");
  if(badge && totalSynced > 0){
    badge.textContent = `✅ ${totalSynced} fiche(s) synchronisée(s)`;
    badge.className = "conn-badge online";
    setTimeout(updateConnectionBadge, 2500);
  }
}

window.addEventListener("online", flushPendingQueue);
window.addEventListener("offline", updateConnectionBadge);

  const [y,m,d] = iso.split(" ")[0].split("-");
  const mois=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return `${parseInt(d)} ${mois[parseInt(m)-1]} ${y}`;
}

/* ===================== EXPORT EXCEL ===================== */
function exportExcel(){
  const items = getFilteredItems();
  if(items.length === 0){
    alert("Aucune fiche à exporter avec les filtres actuels.");
    return;
  }
  if(typeof XLSX === "undefined"){
    alert("La bibliothèque d'export Excel n'a pas pu se charger (vérifiez la connexion internet) et réessayez.");
    return;
  }

  const rows = items.map(n => {
    const row = {
      "Numéro": n.num,
      "Type": n.type === "interne" ? "Interne" : "Externe",
      "Super Statut": statutLabel(n.type, n.statut),
      "Date de détection": formatDateFr(n.date),
      "Gravité": GRAVITE_LABEL[n.gravite],
      "Référence / produit": n.reference || "",
      "Description": n.description || ""
    };
    if(n.type === "interne"){
      row["Service / atelier concerné"] = n.service || "";
      row["Fiche atelier"] = n.ficheAtelier || "";
    } else {
      row["Client"] = n.client || "";
      row["N° commande / BL"] = n.commande || "";
      row["Contact client"] = n.contact || "";
      row["Sous-statut"] = n.sousStatut || "";
    }
    row["Fournisseur"] = n.fournisseur || "";
    row["Observé par"] = n.observeQui || "";
    row["Date d'observation"] = n.observeDate ? formatDateFr(n.observeDate) : "";
    row["Où (poste / lieu)"] = n.observePoste || "";
    row["Coût estimé (€)"] = n.coutEstime || "";
    row["Service concerné (traitement)"] = n.serviceTraitement || "";
    row["Cause identifiée"] = n.cause || "";
    row["Action corrective immédiate"] = n.actionImmediate || "";
    row["Action corrective définitive"] = n.actionDefinitive || "";
    row["Responsable du traitement"] = n.responsable || "";
    row["Créée le"] = n.createdAt || "";
    row["Créée par"] = n.createdBy || "";
    row["Clôturée le"] = n.clotureAt ? formatDateFr(n.clotureAt) : "";
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  const sheetName = activeType === "interne" ? "NC Internes" : "NC Externes";
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `non-conformites-${activeType}-${dateStr}.xlsx`);
}

function getFilteredItems(){
  const q = document.getElementById("search-input").value.trim().toLowerCase();
  const dateFrom = document.getElementById("filter-date-from").value;
  const dateTo = document.getElementById("filter-date-to").value;
  let items = data.filter(n => n.type === activeType);
  if(activeStatusFilter !== "toutes") items = items.filter(n => n.statut === activeStatusFilter);
  if(dateFrom) items = items.filter(n => n.date && n.date >= dateFrom);
  if(dateTo) items = items.filter(n => n.date && n.date <= dateTo);
  if(q){
    items = items.filter(n => {
      const hay = [n.num, n.reference, n.description, n.client, n.service, n.responsable].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  return items.slice().sort((a,b)=> (a.date < b.date ? 1 : -1));
}

  const dateFrom = document.getElementById("filter-date-from").value;

        <span>📅 ${formatDateFr(n.date)}</span>
        <span>🔧 ${n.reference || "--"}</span>
        ${n.type==='externe' ? `<span>👤 ${n.client || "--"}</span>` : `<span>🏭 ${n.service || "--"}</span>`}

      <h3>Origine interne</h3>

        <label>Service / atelier concerné</label>
        <select id="f-service">
          ${["Production","Soudure","Peinture","Contrôle qualité","Logistique / Expédition","Bureau d'études","Autre"]
            .map(s=>`<option ${n.service===s?'selected':''}>${s}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Fiche atelier</label>
        <input type="text" id="f-fiche-atelier" value="${n.ficheAtelier||''}">
      </div>
      <div class="field">
        <label>Fournisseur (optionnel)</label>
        <input type="text" id="f-fournisseur" value="${n.fournisseur||''}">
      </div>
    </div>` : `
    <div class="section">
      <h3>Origine externe</h3>
      <div class="field">
        <label>Client concerné</label>
        <input type="text" id="f-client" value="${n.client||''}">
      </div>
      <div class="field-row">
        <div class="field">
          <label>N° commande / BL</label>
          <input type="text" id="f-commande" value="${n.commande||''}">
        </div>
        <div class="field">
          <label>Contact client</label>
          <input type="text" id="f-contact" value="${n.contact||''}">
        </div>
      </div>
      <div class="field">
        <label>Fournisseur (optionnel)</label>
        <input type="text" id="f-fournisseur" value="${n.fournisseur||''}">
      </div>
    </div>`;

  const observeHtml = `
    <div class="section">
      <h3>Observé par</h3>
      <div class="field">
        <label>Qui a observé</label>
        <input type="text" id="f-observe-qui" value="${n.observeQui||''}">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Date d'observation</label>
          <input type="date" id="f-observe-date" value="${n.observeDate||''}">
        </div>
        <div class="field">
          <label>Où (poste / lieu)</label>
          <input type="text" id="f-observe-poste" value="${n.observePoste||''}">
        </div>
      </div>
    </div>
    <div class="section">
      <h3>Coût</h3>
      <div class="field">
        <label>Coût estimé (€)</label>
        <input type="text" inputmode="decimal" id="f-cout" value="${n.coutEstime||''}">
      </div>
    </div>`;

  document.getElementById("fiche-body").innerHTML = `
    ${isLocked ? `<div class="note-banner">🔒 Fiche clôturée le ${n.clotureAt ? formatDateFr(n.clotureAt) : formatDateFr(n.date)} — modification réservée au rôle développeur (à venir).</div>` : ""}
    <div class="section">
      <h3>Super Statut</h3>
      <div class="status-row">
        ${["ouverte","encours","cloturee"].map(s=>`
          <button type="button" class="status-pill-btn ${n.statut===s?'active st-'+s:''}" data-statut="${s}" onclick="pickStatus(this,'${s}')">${statutLabel(n.type, s)}</button>
        `).join("")}
      </div>
      ${n.type === "externe" ? `
      <div class="field" style="margin-top:12px;">
        <label>Sous-statut</label>
        <select id="f-sous-statut" onchange="updateCloturerButtonState()" ${sousStatutOptionsFor(n.statut).length === 0 ? 'disabled' : ''}>
          ${renderSousStatutOptions(n.statut, n.sousStatut)}
        </select>
      </div>` : ""}
    </div>

    <div class="section">
      <h3>Détection</h3>
      <div class="field-row">
        <div class="field">
          <label>Date de détection</label>
          <input type="date" id="f-date" value="${n.date}">
        </div>
        <div class="field">
          <label>Gravité</label>
          <select id="f-gravite">
            ${["mineure","majeure","critique"].map(g=>`<option value="${g}" ${n.gravite===g?'selected':''}>${GRAVITE_LABEL[g]}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Référence / produit concerné</label>
        <input type="text" id="f-reference" value="${n.reference||''}">
      </div>
      <div class="field">
        <label>Description du problème constaté</label>
        <textarea id="f-description">${n.description||''}</textarea>
      </div>
    </div>

    ${specifiqueHtml}

    ${observeHtml}

    <div class="section">
      <h3>Traitement</h3>
      <div class="field">
        <label>Service concerné</label>
        <select id="f-service-traitement">
          <option value="">Sélectionner...</option>
          ${["Production","Soudure","Peinture","Contrôle qualité","Logistique / Expédition","Bureau d'études","SAV","Commercial","Autre"]
            .map(s=>`<option ${n.serviceTraitement===s?'selected':''}>${s}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Cause identifiée</label>
        <textarea id="f-cause">${n.cause||''}</textarea>
      </div>
      <div class="field">
        <label>Action corrective immédiate</label>
        <textarea id="f-action-immediate">${n.actionImmediate||''}</textarea>
      </div>
      <div class="field">
        <label>Action corrective définitive / préventive</label>
        <textarea id="f-action-definitive">${n.actionDefinitive||''}</textarea>
      </div>
      <div class="field">
        <label>Responsable du traitement</label>
        <input type="text" id="f-responsable" value="${n.responsable||''}">
      </div>
    </div>

    <div class="section">
      <h3>Photos / preuves</h3>
      <div class="photo-zone">
        <span class="p-icon">📷</span>
        Ajout de photos disponible une fois la fiche connectée à la base
      </div>
    </div>

  `;

  document.getElementById("btn-supprimer").style.display = isLocked ? "none" : "block";
  document.getElementById("btn-enregistrer").style.display = isLocked ? "none" : "block";
  document.getElementById("btn-locked-notice").style.display = isLocked ? "block" : "none";

  const btnCloturer = document.getElementById("btn-cloturer");
  btnCloturer.style.display = isLocked ? "none" : "block";
  updateCloturerButtonState();

  if(isLocked){
    document.querySelectorAll("#fiche-body input, #fiche-body select, #fiche-body textarea, #fiche-body .status-pill-btn")
      .forEach(el => el.disabled = true);
  }

  showScreen("screen-fiche");
}

/* Bouton "Clôturer" : actif seulement si le Super Statut "Clôturée" est sélectionné (+ un sous-statut choisi, pour les Externes uniquement) */
function updateCloturerButtonState(){
  const btn = document.getElementById("btn-cloturer");
  if(!btn || btn.style.display === "none") return;
  const n = data.find(x=>x.id===currentFicheId);
  if(!n) return;
  const activePill = document.querySelector(".status-pill-btn.active");
  const statut = activePill ? activePill.dataset.statut : null;
  if(n.type === "externe"){
    const sousEl = document.getElementById("f-sous-statut");
    const sousVal = sousEl ? sousEl.value : "";
    btn.disabled = !(statut === "cloturee" && sousVal);
  } else {
    btn.disabled = !(statut === "cloturee");
  }
}

function cloturerFiche(){
  if(!confirm("Clôturer définitivement cette fiche de non-conformité ?")) return;
  saveFiche();
}

function pickStatus(btn, statut){
  document.querySelectorAll(".status-pill-btn").forEach(b=>{
    b.classList.remove("active","st-ouverte","st-encours","st-cloturee");
  });
  btn.classList.add("active", "st-"+statut);
  btn.dataset.picked = "1";

  const sousSelect = document.getElementById("f-sous-statut");
  if(sousSelect){
    sousSelect.innerHTML = renderSousStatutOptions(statut, null);
    sousSelect.disabled = sousStatutOptionsFor(statut).length === 0;
  }
  updateCloturerButtonState();
}

function saveFiche(){
  const n = data.find(x=>x.id===currentFicheId);
  if(!n) return;

  const pickedBtn = document.querySelector(".status-pill-btn.active");
  n.statut = pickedBtn ? pickedBtn.dataset.statut : n.statut;
  if(n.statut === "cloturee" && !n.clotureAt){
    n.clotureAt = new Date().toISOString().slice(0,10);
  }
  if(n.statut !== "cloturee"){
    n.clotureAt = null;
  }

  if(n.type === "externe"){
    const sousEl = document.getElementById("f-sous-statut");
    n.sousStatut = sousEl ? sousEl.value : "";
  }

  n.date = document.getElementById("f-date").value;
  n.gravite = document.getElementById("f-gravite").value;
  n.reference = document.getElementById("f-reference").value;
  n.description = document.getElementById("f-description").value;
  n.serviceTraitement = document.getElementById("f-service-traitement").value;
  n.cause = document.getElementById("f-cause").value;
  n.actionImmediate = document.getElementById("f-action-immediate").value;
  n.actionDefinitive = document.getElementById("f-action-definitive").value;
  n.responsable = document.getElementById("f-responsable").value;

  n.observeQui = document.getElementById("f-observe-qui").value;
  n.observeDate = document.getElementById("f-observe-date").value;
  n.observePoste = document.getElementById("f-observe-poste").value;
  n.coutEstime = document.getElementById("f-cout").value;

  if(n.type === "interne"){
    n.service = document.getElementById("f-service").value;
    n.ficheAtelier = document.getElementById("f-fiche-atelier").value;
  } else {
    n.client = document.getElementById("f-client").value;
    n.commande = document.getElementById("f-commande").value;
    n.contact = document.getElementById("f-contact").value;
  }
  n.fournisseur = document.getElementById("f-fournisseur").value;

  if(n._isNew){
    if(canSync()){ syncCreate(n); } else { n._pendingSync = true; }
  } else if(canSync()){
    syncUpdate(n);
  } else {
    n._pendingSync = true;
  }
  persistData();
  updateConnectionBadge();

  goBack("screen-list");
}

function deleteCurrent(){
  if(!confirm("Supprimer cette fiche ?")) return;
  const n = data.find(x=>x.id===currentFicheId);
  data = data.filter(x=>x.id !== currentFicheId);
  if(n && !n._isNew){
    if(canSync()){ syncDelete(n.id); } else { pendingDeletes.push(n.id); }
  }
  persistData();
  updateConnectionBadge();
  goBack("screen-list");
}

/* ===================== CREATION ===================== */
let createType = "interne";

function setCreateType(type){
  createType = type;
  document.getElementById("type-btn-interne").classList.toggle("active", type==="interne");
  document.getElementById("type-btn-externe").classList.toggle("active", type==="externe");
  document.querySelectorAll(".interne-only").forEach(el => el.style.display = type==="interne" ? "block" : "none");
  document.querySelectorAll(".externe-only").forEach(el => el.style.display = type==="externe" ? "block" : "none");
}

function openCreate(){
  createType = activeType;
  setCreateType(activeType);
  document.getElementById("c-date").value = new Date().toISOString().slice(0,10);
  document.getElementById("c-gravite").value = "majeure";
  document.getElementById("c-reference").value = "";
  document.getElementById("c-description").value = "";
  document.getElementById("c-service").value = "";
  document.getElementById("c-fiche-atelier").value = "";
  document.getElementById("c-fournisseur-interne").value = "";
  document.getElementById("c-fournisseur-externe").value = "";
  document.getElementById("c-observe-qui").value = "";
  document.getElementById("c-observe-date").value = "";
  document.getElementById("c-observe-poste").value = "";
  document.getElementById("c-cout").value = "";
  document.getElementById("c-client").value = "";
  document.getElementById("c-commande").value = "";
  document.getElementById("c-contact").value = "";
  document.getElementById("c-responsable").value = "";
  showScreen("screen-create");
}

function createNC(){
  const description = document.getElementById("c-description").value.trim();
  if(!description){
    alert("Merci de décrire le problème constaté avant de créer la fiche.");
    return;
  }
  const now = new Date();
  const nowStr = now.toISOString().slice(0,10) + " " + now.toTimeString().slice(0,5);

  const n = {
    id: "local-" + Date.now(),
    num: "(en attente)",
    _isNew: true,
    type: createType,
    statut: "ouverte",
    gravite: document.getElementById("c-gravite").value,
    date: document.getElementById("c-date").value,
    reference: document.getElementById("c-reference").value,
    description: description,
    cause: "", actionImmediate: "", actionDefinitive: "",
    responsable: document.getElementById("c-responsable").value,
    createdBy: "J. Fontaine",
    createdAt: nowStr,
    clotureAt: null
  };

  n.observeQui = document.getElementById("c-observe-qui").value;
  n.observeDate = document.getElementById("c-observe-date").value;
  n.observePoste = document.getElementById("c-observe-poste").value;
  n.coutEstime = document.getElementById("c-cout").value;

  if(createType === "interne"){
    n.service = document.getElementById("c-service").value;
    n.ficheAtelier = document.getElementById("c-fiche-atelier").value;
    n.fournisseur = document.getElementById("c-fournisseur-interne").value;
  } else {
    n.client = document.getElementById("c-client").value;
    n.commande = document.getElementById("c-commande").value;
    n.contact = document.getElementById("c-contact").value;
    n.fournisseur = document.getElementById("c-fournisseur-externe").value;
  }

  data.push(n);
  if(canSync()){ syncCreate(n); } else { n._pendingSync = true; }
  persistData();
  updateConnectionBadge();

  activeType = createType;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.type===createType));
  activeStatusFilter = "toutes";
  renderChips();
  goBack("screen-list");
}

/* ===================== INIT ===================== */
updateConnectionBadge();
renderChips();
renderList();
loadFromSupabase();
</script>
